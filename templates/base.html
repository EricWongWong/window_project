{% load static %}<!-- 必须放在文件的第一行 -->
<!DOCTYPE html>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">香港驗窗維修工程</a>
